[package]
name = "clat-desktop"
version.workspace = true
edition = "2024"
publish = false
license-file = "../LICENSE"
description = "CLAT Desktop: a thin native client of the shared Host"

[dependencies]
clat-core = { path = "../crates/core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
url = "2"
base64 = "0.22"
minisign-verify = "0.2.5"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
font-kit = "=0.14.3"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time", "sync", "macros"] }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[target.'cfg(any(target_os = "macos", windows))'.dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }

# Native attributed menu titles reuse the Objective-C crates already used by Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAttributedString", "NSColor", "NSFont", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSAttributedString", "NSRange", "NSString"] }
