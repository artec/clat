[package]
name = "clat-desktop"
version.workspace = true
edition = "2024"
publish = false
license-file = "../LICENSE"
description = "CLAT Desktop: a thin native client of the shared Host"

[dependencies]
clat-core = { path = "../crates/core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
url = "2"
base64 = "0.22"
minisign-verify = "0.2.5"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time", "sync", "macros"] }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[target.'cfg(any(target_os = "macos", windows))'.dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
