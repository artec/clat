name: Desktop
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native check target (optional Windows test installer)
        type: choice
        default: all
        options: [all, aarch64-apple-darwin, x86_64-apple-darwin, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
      installer:
        description: Build unsigned Windows test installer (macOS uses bun app:build locally)
        type: boolean
        default: false
  # Plan from the complete diff. Workflow-level path lists used to omit shared
  # core/toolchain inputs; the planner also handles multi-commit pushes/renames.
  push:
    branches: [main]
  pull_request:
env:
  CLAT_LANG: en
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-shell:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --prefix web/e2e --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: web/e2e
      - run: npx playwright test --config playwright.desktop.config.js
        working-directory: web/e2e
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.assets.outputs.matrix }}
      native: ${{ steps.changes.outputs.native }}
      tooling: ${{ steps.changes.outputs.tooling }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - id: changes
        run: bun desktop/scripts/check-plan.ts
      # The catalog checker imports the pinned TypeScript parser. Clean runners
      # need these development dependencies on pushes as well as manual runs.
      - run: bun install --cwd desktop --frozen-lockfile --ignore-scripts
      - name: Validate language keys and parameters (wording is flexible)
        run: bun scripts/i18n-check.ts
      - id: assets
        if: github.event_name == 'workflow_dispatch'
        env:
          DESKTOP_TARGET: ${{ inputs.target || 'all' }}
        run: echo "matrix=$(bun desktop/scripts/release.ts matrix --kind desktop --target "$DESKTOP_TARGET")" >> "$GITHUB_OUTPUT"
  tooling:
    needs: plan
    if: needs.plan.outputs.tooling == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd desktop --frozen-lockfile --ignore-scripts
      - run: bun scripts/i18n-installers.ts --check
      - run: bun test scripts/i18n-check.test.ts scripts/i18n-installers.test.ts
      - run: bun test desktop/scripts --timeout 60000
      - run: bun desktop/node_modules/typescript/bin/tsc --project desktop/tsconfig.json
  native:
    # Automatic native validation lives in CI's existing platform jobs. This
    # entry remains available for an explicitly requested standalone check.
    if: github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - name: Install the pinned native target
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup target add --toolchain "$channel" "${{ matrix.target }}"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v4-product-native
          shared-key: product-${{ matrix.target }}
          save-if: false
      - run: bun install --cwd desktop --frozen-lockfile --ignore-scripts
      - run: cargo clippy -p clat-desktop --all-targets --locked --target ${{ matrix.target }} -- -D warnings
        env:
          CARGO_BUILD_JOBS: 2
      - run: cargo test -p clat-desktop --locked --target ${{ matrix.target }}
        env:
          CARGO_BUILD_JOBS: 2
      - run: bun scripts/i18n-check.ts && bun scripts/i18n-installers.ts --check
      - run: bun test scripts/i18n-check.test.ts scripts/i18n-installers.test.ts
      - run: bun test desktop/scripts --timeout 60000
      - run: bun desktop/node_modules/typescript/bin/tsc --project desktop/tsconfig.json
      # Manual Windows installers are test artifacts, never release inputs.
      - name: Optional Windows test installer
        if: github.event_name == 'workflow_dispatch' && inputs.installer && startsWith(matrix.platform, 'windows')
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          bun desktop/scripts/release.ts build --target ${{ matrix.target }} --release --official
          bun desktop/scripts/release.ts package --target ${{ matrix.target }} --output dist-desktop
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch' && inputs.installer && startsWith(matrix.platform, 'windows')
        with:
          name: test-desktop-${{ matrix.platform }}
          path: dist-desktop/*
          if-no-files-found: error
