name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    # 钉版（同 release.yml 先例）：ubuntu-latest 将于 2026-10-19 迁往
    # Ubuntu 26；CI 平台变更须显式验证后再切换，不随 label 漂移。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Complete Linux gates
        timeout-minutes: 15
        # Workspace default-members cover both product crates. Shared gates also
        # install the pinned official web recipe and run the isolated JS component
        # experiment before the ignored MCP tests.
        run: scripts/gates.sh --ci

  # F-W1（2026-08-22 复核派工）：Windows 测试腿——收口所有
  # `#[cfg(windows)]` 代码与测试的历史性 CI 零覆盖，并完成 FP-05
  # （替换原子性）偏差裁定的实机验证：`upgrade::` 的 stage/swap/
  # 回滚测试在真 Windows 文件系统语义（rename-no-replace、运行中
  # exe 占用）下常跑。门控腿（python3 假 server / node e2e）不在
  # Windows 跑——那些 fixture 依赖 POSIX shell 形态。
  windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.2

      # Target-specific cfg arms used to accumulate warnings that macOS/Linux
      # clippy could not see. Keep the complete Windows code/test surface
      # warning-free before executing the native filesystem tests below.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        timeout-minutes: 15
        # Same product workspace members as Linux; never narrow this to -p clat.
        run: |
          cargo test --all-targets --all-features
          cargo test -p clat-wasm-net --lib

  plugin-performance:
    name: Plugin performance (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            measure: true
          - os: macos-latest
            target: x86_64-apple-darwin
            measure: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            measure: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            measure: false
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            measure: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            measure: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
      # I4（2026-10-05，登记簿在案）：rust-toolchain.toml 钉版后，
      # cargo 经 rustup 代理用钉版工具链；dtolnay 的 targets 装进
      # stable 而非钉版 channel，交叉目标须显式补装（release.yml
      # 同款先例）。缺此步时 aarch64-pc-windows-msvc 报 E0463。
      - name: Add the pinned toolchain cross target
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup target add --toolchain "$channel" "${{ matrix.target }}"
      - name: Compile the complete target surface
        run: cargo check --locked --all-targets --all-features --target ${{ matrix.target }}
      - name: Test authenticated compiler cache
        if: matrix.measure
        run: cargo test --locked -p clat-wasm-net --lib compiled_cache
      - name: Repeated SHA comparison (debug)
        if: matrix.measure
        run: cargo test --locked -p clat-wasm-net --lib perf_sha_samples -- --ignored --nocapture
      - name: Repeated SHA comparison (release)
        if: matrix.measure
        run: cargo test --locked --release -p clat-wasm-net --lib perf_sha_samples -- --ignored --nocapture
