name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CLAT_LANG: en

jobs:
  desktop-plan:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.changes.outputs.native }}
      tooling: ${{ steps.changes.outputs.tooling }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - id: changes
        run: bun desktop/scripts/check-plan.ts

  check:
    name: Format, lint, test
    # 钉版（同 release.yml 先例）：ubuntu-latest 将于 2026-10-19 迁往
    # Ubuntu 26；CI 平台变更须显式验证后再切换，不随 label 漂移。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Do not restore older caches containing target/doc: rust-cache 2.9.2
          # mistakes rustdoc's source directories named tests for build output.
          prefix-key: v1-rust-without-doc

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Complete Linux gates
        # This is the whole sequential gate, including cold Rust builds and
        # the real JS component probe. Run 39561574997 exhausted 15 minutes.
        # Keep per-test/tool deadlines unchanged; bound the aggregate instead.
        timeout-minutes: 30
        # Workspace default-members cover both product crates. Shared gates also
        # install the pinned official web recipe and run the isolated JS component
        # experiment before the ignored MCP tests.
        run: scripts/gates.sh --ci

      # Documentation is checked above, but is not a published CI artifact.
      # Keep it out of the cache plugin's post-job target traversal, including
      # when a later gate fails after cargo doc has already succeeded.
      - name: Exclude generated documentation from Rust cache
        if: always()
        shell: bash
        run: rm -rf -- target/doc

  # F-W1（2026-08-22 复核派工）：Windows 测试腿——收口所有
  # `#[cfg(windows)]` 代码与测试的历史性 CI 零覆盖，并完成 FP-05
  # （替换原子性）偏差裁定的实机验证：`upgrade::` 的 stage/swap/
  # 回滚测试在真 Windows 文件系统语义（rename-no-replace、运行中
  # exe 占用）下常跑。门控腿（python3 假 server / node e2e）不在
  # Windows 跑——那些 fixture 依赖 POSIX shell 形态。
  windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse the user PowerShell installer
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.2

      # Target-specific cfg arms used to accumulate warnings that macOS/Linux
      # clippy could not see. Keep the complete Windows code/test surface
      # warning-free before executing the native filesystem tests below.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        timeout-minutes: 15
        # Same product workspace members as Linux; never narrow this to -p clat.
        # windows_sandbox is included: its native ACL/token/Job acceptance has
        # no self-skip path; provider unavailable is a failed test.
        # Separate steps preserve each native command's exit status in pwsh.
        run: cargo test --all-targets --all-features

      - name: Test WASM network backend
        timeout-minutes: 15
        run: cargo test -p clat-wasm-net --lib


  plugin-performance:
    name: Plugin performance (${{ matrix.target }})
    needs: desktop-plan
    env:
      # CI needs assertions and real native links, not full variable/type DWARF.
      # Match Release/manual readers so profile flags do not split cache keys.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            measure: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            measure: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            measure: true
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            measure: false
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            measure: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            measure: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      # I4（2026-10-05，登记簿在案）：rust-toolchain.toml 钉版后，
      # cargo 经 rustup 代理用钉版工具链；dtolnay 的 targets 装进
      # stable 而非钉版 channel，交叉目标须显式补装（release.yml
      # 同款先例）。缺此步时 aarch64-pc-windows-msvc 报 E0463。
      - name: Add the pinned toolchain cross target
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup target add --toolchain "$channel" "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@v2.9.2
        id: product-cache
        if: contains(matrix.target, 'apple-darwin') || contains(matrix.target, 'windows')
        with:
          # v3 warmed core alone; a hit there does not prove CLI features exist.
          prefix-key: v4-product-native
          shared-key: product-${{ matrix.target }}
          # One writer owns native-check AND release dependencies. Script-only
          # runs must not publish an incomplete immutable cache on a cold key.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.desktop-plan.outputs.native == 'true' }}
          cache-on-failure: false
      - name: Compile the complete target surface
        run: cargo check --locked --all-targets --all-features --target ${{ matrix.target }}
      # Reuse this job's core dependency graph instead of launching four more
      # native builds in Desktop. Keep the actual clippy/test commands separate.
      - name: Clippy desktop
        if: needs.desktop-plan.outputs.native == 'true' && (contains(matrix.target, 'apple-darwin') || contains(matrix.target, 'windows'))
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo clippy -p clat-desktop --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Test desktop
        if: needs.desktop-plan.outputs.native == 'true' && (contains(matrix.target, 'apple-darwin') || contains(matrix.target, 'windows'))
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test -p clat-desktop --locked --target ${{ matrix.target }}
      - uses: actions/setup-node@v5
        if: needs.desktop-plan.outputs.tooling == 'true' && (contains(matrix.target, 'apple-darwin') || contains(matrix.target, 'windows'))
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: needs.desktop-plan.outputs.tooling == 'true' && (contains(matrix.target, 'apple-darwin') || contains(matrix.target, 'windows'))
        with:
          bun-version: 1.3.14
      - name: Install desktop tooling
        if: needs.desktop-plan.outputs.tooling == 'true' && (contains(matrix.target, 'apple-darwin') || contains(matrix.target, 'windows'))
        run: bun install --cwd desktop --frozen-lockfile --ignore-scripts
      - name: Test desktop tooling on native platforms
        if: needs.desktop-plan.outputs.tooling == 'true' && (contains(matrix.target, 'apple-darwin') || contains(matrix.target, 'windows'))
        run: bun test desktop/scripts --timeout 60000
      - name: Test authenticated compiler cache
        if: matrix.measure
        run: cargo test --locked --target ${{ matrix.target }} -p clat-wasm-net --lib compiled_cache
      - name: Repeated SHA comparison (debug)
        if: matrix.measure
        run: cargo test --locked --target ${{ matrix.target }} -p clat-wasm-net --lib perf_sha_samples -- --ignored --nocapture
      - name: Repeated SHA comparison (release)
        if: matrix.measure
        run: cargo test --locked --release --target ${{ matrix.target }} -p clat-wasm-net --lib perf_sha_samples -- --ignored --nocapture
      # Match Release's complete default-member selection, not core alone:
      # CLI dependencies unify extra features (e.g. hashbrown via ratatui/lru)
      # that also change Wasmtime/Cranelift fingerprints. Keep GUI warming a
      # separate invocation so both production feature variants are cached.
      - name: Warm release CLI dependencies
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.desktop-plan.outputs.native == 'true' && steps.product-cache.outputs.cache-hit != 'true' && (contains(matrix.target, 'apple-darwin') || contains(matrix.target, 'windows'))
        timeout-minutes: 30
        env:
          CLAT_OFFICIAL_RELEASE: '1'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Warm release Windows GUI dependencies
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.desktop-plan.outputs.native == 'true' && steps.product-cache.outputs.cache-hit != 'true' && contains(matrix.target, 'windows')
        timeout-minutes: 30
        env:
          CARGO_BUILD_JOBS: 2
          CLAT_OFFICIAL_RELEASE: '1'
        run: cargo build -p clat-desktop --release --locked --target ${{ matrix.target }} --features tauri/custom-protocol
