name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # 门控测试（python3 假 server / wasm fixture）：默认 `cargo test`
      # 看不见 #[ignore] 面——A2 的两个判别测试只在ignored腿设防
      # （2026-08-22 审计提醒）。ubuntu runner 自带 python3。
      - name: Gated tests
        run: cargo test --lib -- --ignored
