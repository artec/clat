name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Complete Linux gates
        run: scripts/gates.sh --ci

  # F-W1（2026-08-22 复核派工）：Windows 测试腿——收口所有
  # `#[cfg(windows)]` 代码与测试的历史性 CI 零覆盖，并完成 FP-05
  # （替换原子性）偏差裁定的实机验证：`upgrade::` 的 stage/swap/
  # 回滚测试在真 Windows 文件系统语义（rename-no-replace、运行中
  # exe 占用）下常跑。门控腿（python3 假 server / node e2e）不在
  # Windows 跑——那些 fixture 依赖 POSIX shell 形态。
  windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.2

      # Target-specific cfg arms used to accumulate warnings that macOS/Linux
      # clippy could not see. Keep the complete Windows code/test surface
      # warning-free before executing the native filesystem tests below.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features
