name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.assets.outputs.cli }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd desktop --frozen-lockfile --ignore-scripts
      - id: assets
        shell: bash
        run: |
          echo "cli=$(bun desktop/scripts/release.ts matrix --kind cli)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: plan
    env:
      CLAT_OFFICIAL_RELEASE: "1"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cli) }}
    steps:
      - uses: actions/checkout@v5

      # 发布身份守卫（2026-09-21 v1.4.1 事故）：tag 与 workspace 版本
      # 不一致即拒绝出产物。说谎的发布（tag 1.4.1 / 二进制自报 1.4.0）
      # 会让升级链与宿主接管（MF-1c 按二进制自报版本比较）全部失真。
      # 版本唯一权威在 Cargo.toml [workspace.package]（发布包继承）。
      - name: Refuse tags that do not match the workspace version
        # shell 必须显式 bash：Windows runner 的 run: 默认 pwsh，
        # bash 参数展开与 [ ] 测试语法在 pwsh 下必炸（v1.4.2 两跑
        # Windows 腿红的真因；首诊误记 autocrlf/sed——那只是并存
        # 的潜在问题，shell 错配才是首死因）。
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Select the version tag when manually running Release" >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          # 无 $ 行尾锚 + .* 吞尾：autocrlf checkout 可给行尾添 \r。
          version="$(sed -n 's/^version = "\(.*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match workspace version ${version:-<none>} — bump the [workspace.package] version before tagging" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml 钉版后，cargo 经 rustup 代理用钉版工具链，
      # 而上面 action 把交叉 target 装进它装的 stable——两者错位时
      # host target 恒过、交叉 target 必挂 E0463 "can't find crate for
      # core"（v1.2.4 的 aarch64-windows / x86_64-darwin 两腿病历，
      # 2026-09-08）。单一事实源：从 toml 读钉版，给**钉版**装 target。
      - name: Install the pinned cross target
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup target add --toolchain "$channel" "${{ matrix.target }}"

      # rust-cache 钉 v2.9.2：v2.9.0 起才是 node24 运行时，浮动 @v2
      # 无法保证不回落到 node20 构建并触发弃用警告（与 ci.yml 一致）。
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2
        if: contains(matrix.target, 'windows') || contains(matrix.target, 'apple-darwin')
        with:
          bun-version: 1.3.14
      - name: Install desktop build tools
        if: contains(matrix.target, 'windows') || contains(matrix.target, 'apple-darwin')
        run: bun install --cwd desktop --frozen-lockfile --ignore-scripts
      - name: Find previous backend from this run
        id: probe
        if: contains(matrix.target, 'windows') || contains(matrix.target, 'apple-darwin')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun desktop/scripts/backend.ts probe --target ${{ matrix.target }}
      - name: Download previous backend
        id: reuse
        if: steps.probe.outputs.found == 'true'
        uses: actions/download-artifact@v7
        with:
          name: backend-${{ matrix.target }}
          path: dist-backend
      - name: Verify and restore previous CLI
        if: steps.reuse.outcome == 'success'
        run: bun desktop/scripts/backend.ts restore --target ${{ matrix.target }} --output dist-backend
      - name: Build
        if: steps.reuse.outcome != 'success'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Record reusable backend
        if: steps.reuse.outcome != 'success' && (contains(matrix.target, 'windows') || contains(matrix.target, 'apple-darwin'))
        run: bun desktop/scripts/backend.ts record --target ${{ matrix.target }} --output dist-backend
      - name: Save reusable CLI before desktop compilation
        if: steps.reuse.outcome != 'success' && (contains(matrix.target, 'windows') || contains(matrix.target, 'apple-darwin'))
        uses: actions/upload-artifact@v6
        with:
          name: backend-${{ matrix.target }}
          path: dist-backend/*
          if-no-files-found: error

      - name: Package (windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/clat.exe `
            -DestinationPath clat-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Package (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          tar -czf clat-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release clat

      # 每个平台只产出单项清单。CI 无权签名；离线维护者验收 draft
      # 后才运行 ./publish 完成签名和发布。
      - name: Checksums
        shell: bash
        run: |
          for f in clat-${{ github.ref_name }}-${{ matrix.target }}.*; do
            case "$f" in
              *.sha256) ;;
              *) sha256sum "$f" > "$f.sha256" ;;
            esac
          done

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          overwrite: true
          path: clat-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

      - name: Build Windows desktop using this job's CLI
        if: contains(matrix.target, 'windows')
        env:
          CARGO_BUILD_JOBS: 2
        run: bun desktop/scripts/release.ts build --target ${{ matrix.target }} --release --official --backend dist-backend
      - name: Collect Windows desktop assets
        if: contains(matrix.target, 'windows')
        run: bun desktop/scripts/release.ts package --target ${{ matrix.target }} --output dist-desktop
      - uses: actions/upload-artifact@v6
        if: contains(matrix.target, 'windows')
        with:
          name: release-desktop-${{ matrix.target }}
          path: dist-desktop/*
          if-no-files-found: error
          overwrite: true

  stage-draft:
    name: Stage unsigned draft
    needs: [build]
    # 钉版（同 ci.yml 与资产矩阵先例）：ubuntu-latest 将于 2026-10-19
    # 迁往 Ubuntu 26；平台变更须显式验证后再切换，不随 label 漂移。
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          # CI deliberately cannot access the offline release key. Assets and
          # manifests stay invisible to latest-release clients until a
          # maintainer runs ./publish and uploads signatures.
          draft: true
          generate_release_notes: false
          body: ""
          files: dist/*
