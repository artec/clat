name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 资产矩阵：macOS 与 Windows 各两组，与 `clat upgrade` 的
        # target_triple 识别一一对应。Linux 钉在 ubuntu-24.04（GitHub
        # 当前最低规范基线），不用 -latest：产物要求 glibc 2.39+
        # （Ubuntu 24.04 同代及以上）；更老的发行版请从源码构建。
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      # 发布身份守卫（2026-09-21 v1.4.1 事故）：tag 与 workspace 版本
      # 不一致即拒绝出产物。说谎的发布（tag 1.4.1 / 二进制自报 1.4.0）
      # 会让升级链与宿主接管（MF-1c 按二进制自报版本比较）全部失真。
      # 版本唯一权威在 Cargo.toml [workspace.package]（两包继承）。
      - name: Refuse tags that do not match the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # 无 $ 行尾锚 + .* 吞尾：Windows runner 的 autocrlf checkout 会给
          # Cargo.toml 行尾添 \r，锚定 $ 的模式提取为空、守卫误拒全部
          # Windows 腿（v1.4.2 首跑两红的事后病历，autocrlf 老病新发）。
          version="$(sed -n 's/^version = "\(.*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match workspace version ${version:-<none>} — bump the [workspace.package] version before tagging" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml 钉版后，cargo 经 rustup 代理用钉版工具链，
      # 而上面 action 把交叉 target 装进它装的 stable——两者错位时
      # host target 恒过、交叉 target 必挂 E0463 "can't find crate for
      # core"（v1.2.4 的 aarch64-windows / x86_64-darwin 两腿病历，
      # 2026-09-08）。单一事实源：从 toml 读钉版，给**钉版**装 target。
      - name: Install the pinned cross target
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup target add --toolchain "$channel" "${{ matrix.target }}"

      # rust-cache 钉 v2.9.2：v2.9.0 起才是 node24 运行时，浮动 @v2
      # 无法保证不回落到 node20 构建并触发弃用警告（与 ci.yml 一致）。
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/clat.exe `
            -DestinationPath clat-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Package (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          tar -czf clat-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release clat

      # 每个平台只产出单项清单。CI 无权签名；离线维护者验收 draft
      # 后才运行 ./publish 完成签名和发布。
      - name: Checksums
        shell: bash
        run: |
          for f in clat-${{ github.ref_name }}-${{ matrix.target }}.*; do
            case "$f" in
              *.sha256) ;;
              *) sha256sum "$f" > "$f.sha256" ;;
            esac
          done

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: clat-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  stage-draft:
    name: Stage unsigned draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          # CI deliberately cannot access the offline release key. Assets and
          # manifests stay invisible to latest-release clients until a
          # maintainer runs ./publish and uploads signatures.
          draft: true
          generate_release_notes: false
          body: ""
          files: dist/*
