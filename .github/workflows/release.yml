name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/clat.exe `
            -DestinationPath clat-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Package (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          tar -czf clat-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release clat

      - uses: softprops/action-gh-release@v2
        with:
          files: clat-${{ github.ref_name }}-${{ matrix.target }}.*
