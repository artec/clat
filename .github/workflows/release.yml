name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 资产矩阵：macOS 与 Windows 各两组，与 `clat upgrade` 的
        # target_triple 识别一一对应。Linux 钉在 ubuntu-24.04（GitHub
        # 当前最低规范基线），不用 -latest：产物要求 glibc 2.39+
        # （Ubuntu 24.04 同代及以上）；更老的发行版请从源码构建。
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-cache 钉 v2.9.2：v2.9.0 起才是 node24 运行时，浮动 @v2
      # 无法保证不回落到 node20 构建并触发弃用警告（与 ci.yml 一致）。
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/clat.exe `
            -DestinationPath clat-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Package (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          tar -czf clat-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release clat

      # 每个平台只产出单项清单。CI 无权签名；离线维护者验收 draft
      # 后才运行 ./publish 完成签名和发布。
      - name: Checksums
        shell: bash
        run: |
          for f in clat-${{ github.ref_name }}-${{ matrix.target }}.*; do
            case "$f" in
              *.sha256) ;;
              *) sha256sum "$f" > "$f.sha256" ;;
            esac
          done

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: clat-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  stage-draft:
    name: Stage unsigned draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          # CI deliberately cannot access the offline release key. Assets and
          # manifests stay invisible to latest-release clients until a
          # maintainer runs ./publish and uploads signatures.
          draft: true
          generate_release_notes: false
          body: ""
          files: dist/*
