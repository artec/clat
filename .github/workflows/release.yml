name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 资产矩阵：macOS 与 Windows 各两组，与 `clat upgrade` 的
        # target_triple 识别一一对应。Linux 资产暂缓，后续再上架。
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/clat.exe `
            -DestinationPath clat-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Package (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          tar -czf clat-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release clat

      # 随资产发布 SHA-256 校验文件：`clat upgrade` 下载后强制校验，
      # 不匹配即中止（防 CDN/传输篡改；账户失陷需进一步签名链）。
      - name: Checksums
        shell: bash
        run: |
          for f in clat-${{ github.ref_name }}-${{ matrix.target }}.*; do
            case "$f" in
              *.sha256) ;;
              *) sha256sum "$f" > "$f.sha256" ;;
            esac
          done

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            clat-${{ github.ref_name }}-${{ matrix.target }}.*
            clat-${{ github.ref_name }}-${{ matrix.target }}.*.sha256
