[package]
name = "tokenplan-quota"
version.workspace = true
edition = "2024"
publish = false
license-file = "../../LICENSE"
description = "Standalone Qianwen AI Platform / Aliyun Bailian Token Plan quota client (device-flow auth + console gateway)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22.1"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
