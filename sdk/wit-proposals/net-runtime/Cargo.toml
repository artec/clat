[package]
name = "clat-wasm-net"
version.workspace = true
edition = "2024"
publish = false
license-file = "../../../LICENSE"

# One implementation home shared with the isolated author probes.
[lib]
path = "../http-consumer-host/src/lib.rs"

[features]
test-support = []

[dependencies]
bytes = "1"
flate2 = "=1.1.10"
brotli-decompressor = "=5.0.0"
http = "1"
http-body = "1"
http-body-util = "0.1"
serde_json = { version = "1", features = ["raw_value"] }
minisign-verify = "0.2.5"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time", "rt", "sync", "macros", "net", "io-util"] }
url = "=2.5.8"
wasmtime = { version = "=48.0.0", default-features = false, features = ["cranelift", "component-model", "runtime", "std", "wat"] }
wasmtime-wasi = "=48.0.0"


rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"


hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }


[dev-dependencies]
clat-core = { path = "../../../crates/core", features = ["test-support"] }
