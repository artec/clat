[package]
name = "clat"
version = "0.9.3"
edition = "2024"
description = "A rock-solid agent foundation: fast, local-first, one Rust binary"
license-file = "LICENSE"

# 插件桥 Phase 2（docs/todo/wasm-plugin-runtime.md）：试点插件是
# workspace 成员（构建它们需要 `rustup target add wasm32-wasip2`，
# 构建 clat 本体不需要）。根包隐式属于本 workspace。
[workspace]
members = [
    "plugins/digest",
    "plugins/greeter",
    "plugins/probe",
    "plugins/read",
    "sdk/clat-plugin",
]

[[bin]]
name = "clat"
path = "src/main.rs"

[dependencies]
# Capability-relative filesystem operations keep project writes bound to an
# opened directory handle across symlink and directory-replacement races.
cap-std = "4.0.2"
# `cap-std` deliberately exposes only sandboxed relative operations.  The
# session store also needs an atomic no-follow directory open for each opaque
# bucket/session component, which is the lower-level primitive re-exported by
# this companion crate.
cap-primitives = "4.0.2"
# Cross-platform process groups (Unix) and Job Objects (Windows) make command
# timeout/cancellation cover the complete descendant tree.
command-group = "5.0.1"
# `clat exec` turns Ctrl-C into a graceful CancelToken trip so partial output
# still persists; a second press hard-exits 130. Installed once at the
# process boundary in main.rs (the lib exposes ExecCancel instead).
ctrlc = "3"
crossterm = "0.29"
minisign-verify = "0.2.5"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps json!-built payloads in insertion order, matching
# DSH's JSON.stringify field order for byte-level wire compat.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
unicode-width = "0.2"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
url = "2"
# DSH-compatible session logs: every durable append batch is one independent
# zstd frame with a content checksum
# (docs/research/dsh-session-compatibility.md §7).
zstd = "0.13"
# SessionId / message ids are UUIDs, matching DSH's crypto.randomUUID().
uuid = { version = "1", features = ["v4"] }
# W1-10：实现 wasmtime-wasi-io 的 `Pollable` trait（用 async-trait
# 作者的脱糖形状；已在依赖树内，随 wasmtime-wasi 传递）。
async-trait = "0.1"
# WASM 组件插件运行时（插件桥 Phase 2a）。最小特性集（尺寸闸门实测
# +8.69MB→15.56MB，docs/research/dsh-plugin-bridge.md §3）：cranelift
# JIT + component-model（WIT）+ 运行时 + wat（测试用文本组件）。
# 刻意不带 async/pooling/cache 等默认特性——按需再加。
wasmtime = { version = "48", default-features = false, features = [
    "cranelift",
    "component-model",
    "runtime",
    "std",
    "wat",
] }
wasmtime-wasi = "48.0.0"
# W1-10：组装"有界时钟"的 WASI linker 需要逐接口注册（镜像
# wasmtime-wasi p2 的内部组合、但把 monotonic-clock 宿主换成有界实现），
# 其中 wasi:io/error 的绑定只由这个伴生 crate 导出（同版本对、
# wasmtime-wasi 未转出）。已在依赖树内，非新增传递依赖。
wasmtime-wasi-io = "48.0.0"

# flock-based storage-root lease (Unix); a build-only C dependency at most.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

# Release 构建优化（2026-08-21）：thin LTO + 单 codegen unit 跨 crate
# 内联（会话回放的 zstd 解码 / JSON 解析与 markdown 渲染受益），strip
# 掉符号（bundled SQLite + rustls 的调试符号使裸二进制显著变小）。
# 刻意不用 panic = "abort"：catch_unwind 是承重的（插件拆解的 panic
# 隔离），见 AGENTS.md 分层规则与 plugin/effect.rs。
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
