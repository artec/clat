[package]
name = "clat"
version = "1.3.1"
edition = "2024"
description = "A rock-solid agent foundation: fast, local-first, one Rust binary"
license-file = "LICENSE"

# 插件桥 Phase 2（docs/todo/wasm-plugin-runtime.md）：试点插件是
# workspace 成员（构建它们需要 `rustup target add wasm32-wasip2`，
# 构建 clat 本体不需要）。根包隐式属于本 workspace。
[workspace]
default-members = [".", "crates/core"]
members = [
    "crates/core",
    "plugins/digest",
    "plugins/greeter",
    "plugins/probe",
    "plugins/read",
    "sdk/clat-plugin",
]

[[bin]]
name = "clat"
path = "src/main.rs"

[features]
# Ordinary cargo test and every delivery gate retain the integration face.
# Narrow pure-UI edit loops explicitly disable this harness-only feature.
default = ["runtime-tests"]
runtime-tests = []

[dependencies]
clat-core = { path = "crates/core" }
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
base64 = "0.22.1"
cap-std = "4.0.2"
command-group = "5.0.1"
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
hmac = "0.12"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
unicode-width = "0.2"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
clat-core = { path = "crates/core", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Release 构建优化（2026-08-21）：thin LTO + 单 codegen unit 跨 crate
# 内联（会话回放的 zstd 解码 / JSON 解析与 markdown 渲染受益），strip
# 掉符号（bundled SQLite + rustls 的调试符号使裸二进制显著变小）。
# 刻意不用 panic = "abort"：catch_unwind 是承重的（插件拆解的 panic
# 隔离），见 AGENTS.md 分层规则与 plugin/effect.rs。
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Keep the edit/test loop from generating full debug information for the large
# CLAT test harness. Dependency artifacts and release/debug builds are unchanged.
# For source-level debugging, temporarily set this package override to 2.
[profile.test.package.clat]
debug = 0

[profile.test.package.clat-core]
debug = 0
