[package]
name = "clat"
version = "0.3.0"
edition = "2024"
description = "A fast, local-first, open-source command-line agent runtime"
license-file = "LICENSE"

[[bin]]
name = "clat"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-width = "0.2"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
url = "2"
